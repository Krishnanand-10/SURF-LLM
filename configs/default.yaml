# SURF-LLM Configuration File

model:
  name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"  # High-quality instruction-following model for clean dialog & QA
  device: "cuda"  # Will auto-fallback to cpu if cuda unavailable
  torch_dtype: "float16"
  load_in_4bit: false

localization:
  method: "gradient_saliency"  # "gradient_saliency" or "fisher"
  top_k_layers: 4              # Number of most sensitive layers to attach LoRA to
  target_modules: ["mlp.down_proj", "mlp.up_proj", "mlp.gate_proj"] # Target module types

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  num_epochs: 3
  kl_weight: 1.0               # Lambda: weighting of retain KL divergence preservation
  max_grad_norm: 1.0
  forget_loss_type: "grad_ascent"  # "grad_ascent", "npo" (negative preference), or "refusal"

data:
  forget_data_path: "data/sample_forget.jsonl"
  retain_data_path: "data/sample_retain.jsonl"
  max_seq_length: 512

output:
  output_dir: "./outputs/surf_experiment"
  save_fused_model: true
